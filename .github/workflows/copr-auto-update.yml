name: Update packages on COPR

on:
  workflow_dispatch:
  schedule:
    - cron: "23 21 * * *" # 21:23 UTC = 05:23 Beijing time, after the Pages repo sync

permissions:
  contents: write

concurrency:
  group: copr-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3-rpm

      - name: Detect upstream updates and bump specs
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-updates.py

      - name: Commit and push bumped specs
        if: steps.bump.outputs.changed != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update specs: ${{ steps.bump.outputs.changed }}"
          git push

      - name: Wait for the payload mirror (linuxqq / netease-cloud-music)
        if: steps.bump.outputs.changed != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The pushed bump triggers the "Mirror upstream payloads"
          # workflow (path filters). COPR's Source0 fetches the mirrored
          # release asset, so the mirror MUST finish before we fire the
          # COPR webhooks.
          need=""
          for pkg in ${{ steps.bump.outputs.changed }}; do
            case " linuxqq netease-cloud-music " in
                *" $pkg "*) need=1 ;;
            esac
          done
          if [ -z "$need" ]; then
            echo "No payload-mirrored package was bumped; nothing to wait for."
            exit 0
          fi
          head=$(git rev-parse HEAD)
          for i in $(seq 1 90); do
            st=$(gh api "repos/${{ github.repository }}/actions/workflows/mirror.yml/runs?per_page=5" \
              --jq '.workflow_runs[] | select(.head_sha == "'"$head"'") | .status + " " + (.conclusion // "")' \
              | head -1)
            echo "mirror on $head: ${st:-not started yet} ($i/90)"
            case "$st" in
                "completed success") echo "mirror finished"; exit 0 ;;
                "completed failure") echo "::error::Mirror workflow failed"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Mirror did not complete within 30 minutes"
          exit 1

      - name: Trigger COPR builds via package webhooks
        if: steps.bump.outputs.changed != ''
        env:
          COPR_WEBHOOK_BASE: ${{ secrets.COPR_WEBHOOK_BASE }}
        run: |
          # COPR package webhooks never expire, so no COPR API token is
          # needed here: each SCM package in qvoidz/rpm-packages has
          # "webhook rebuild" enabled and rebuilds its spec from the
          # just-pushed commit when we POST to its webhook URL.
          if [ -z "$COPR_WEBHOOK_BASE" ]; then
            echo "::warning::COPR_WEBHOOK_BASE secret is not configured; spec bumps were pushed but no COPR build was triggered."
            exit 0
          fi
          for pkg in ${{ steps.bump.outputs.changed }}; do
            echo "Triggering COPR rebuild for $pkg ..."
            curl -fsS -X POST "$COPR_WEBHOOK_BASE/$pkg/" \
              || echo "::warning::COPR webhook for $pkg failed"
          done
