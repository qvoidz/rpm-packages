name: Update packages on COPR

on:
  workflow_dispatch:
  schedule:
    - cron: "23 21 * * *" # 21:23 UTC = 05:23 Beijing time, after the Pages repo sync

permissions:
  contents: write
  actions: write # Required for GITHUB_TOKEN to dispatch mirror.yml.

concurrency:
  group: copr-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3-rpm

      - name: Detect upstream updates and bump specs
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-updates.py

      - name: Commit and push bumped specs
        if: steps.bump.outputs.changed != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update specs: ${{ steps.bump.outputs.changed }}"
          git push

      - name: Ensure payload mirror assets exist
        id: mirror
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # GITHUB_TOKEN pushes do not trigger push-based workflows. Also check
          # assets on every scheduled run: a previous CDN failure must not leave
          # a bumped spec permanently stuck after the version detector says
          # "up to date" on subsequent days.
          missing=""
          version=$(sed -n 's/^Version:[[:space:]]*//p' linuxqq/linuxqq.spec | head -1)
          url=$(sed -n 's/^%global qq_rpm_url[[:space:]]*//p' linuxqq/linuxqq.spec)
          tag="linuxqq-$version"
          asset=$(basename "$url")
          if ! gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$asset"; then
            missing="$missing linuxqq"
          fi

          version=$(sed -n 's/^Version:[[:space:]]*//p' netease-cloud-music/netease-cloud-music.spec | head -1)
          url=$(sed -n 's/^%global netease_deb_url[[:space:]]*//p' netease-cloud-music/netease-cloud-music.spec)
          tag="netease-cloud-music-$version"
          asset=$(basename "$url")
          if ! gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$asset"; then
            missing="$missing netease-cloud-music"
          fi

          missing=$(echo "$missing" | xargs)
          if [ -z "$missing" ]; then
            echo "All payload mirror assets already exist."
            echo "mirror_ready=" >> "$GITHUB_OUTPUT"
            echo "mirror_missing=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Missing mirror assets for:$missing"
          head=$(git rev-parse HEAD)

          # workflow_dispatch is explicitly allowed to create a run when called
          # with GITHUB_TOKEN. The push event above is not.
          gh workflow run mirror.yml --ref main

          completed=false
          for i in $(seq 1 90); do
            st=$(HEAD_SHA="$head" gh api "repos/$GH_REPO/actions/workflows/mirror.yml/runs?per_page=20" \
              --jq '.workflow_runs[] | select(.head_sha == env.HEAD_SHA) | .status + " " + (.conclusion // "")' \
              | head -1 || true)
            echo "mirror on $head: ${st:-not started yet} ($i/90)"
            case "$st" in
              "completed success") completed=true; break ;;
              "completed failure"|"completed cancelled"|"completed timed_out")
                echo "::warning::Mirror workflow ended with: $st"
                break
                ;;
            esac
            sleep 20
          done
          if [ "$completed" != true ]; then
            echo "::warning::Mirror workflow did not complete successfully within 30 minutes; checking any assets that may still have been uploaded."
          fi

          # Mirror jobs are independent. Keep packages whose exact assets are
          # ready moving through COPR even if the other vendor CDN is down.
          ready=""
          still_missing=""
          for pkg in $missing; do
            case "$pkg" in
              linuxqq)
                version=$(sed -n 's/^Version:[[:space:]]*//p' linuxqq/linuxqq.spec | head -1)
                url=$(sed -n 's/^%global qq_rpm_url[[:space:]]*//p' linuxqq/linuxqq.spec)
                ;;
              netease-cloud-music)
                version=$(sed -n 's/^Version:[[:space:]]*//p' netease-cloud-music/netease-cloud-music.spec | head -1)
                url=$(sed -n 's/^%global netease_deb_url[[:space:]]*//p' netease-cloud-music/netease-cloud-music.spec)
                ;;
            esac
            tag="$pkg-$version"
            asset=$(basename "$url")
            if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$asset"; then
              echo "Verified mirror asset: $tag/$asset"
              ready="$ready $pkg"
            else
              echo "::warning::Required mirror asset is still missing: release=$tag asset=$asset"
              still_missing="$still_missing $pkg"
            fi
          done

          ready=$(echo "$ready" | xargs)
          still_missing=$(echo "$still_missing" | xargs)
          echo "mirror_ready=$ready" >> "$GITHUB_OUTPUT"
          echo "mirror_missing=$still_missing" >> "$GITHUB_OUTPUT"

      - name: Trigger COPR builds via package webhooks
        if: steps.bump.outputs.changed != '' || steps.mirror.outputs.mirror_ready != ''
        env:
          COPR_WEBHOOK_BASE: ${{ secrets.COPR_WEBHOOK_BASE }}
          MIRROR_MISSING: ${{ steps.mirror.outputs.mirror_missing }}
        run: |
          set -euo pipefail
          packages=""
          for pkg in ${{ steps.bump.outputs.changed }} ${{ steps.mirror.outputs.mirror_ready }}; do
            [ -n "$pkg" ] || continue
            case " $MIRROR_MISSING " in
              *" $pkg "*) echo "$pkg: waiting for its missing mirror asset"; continue ;;
            esac
            case " $packages " in
              *" $pkg "*) continue ;;
            esac
            packages="$packages $pkg"
          done
          packages=$(echo "$packages" | xargs)
          if [ -z "$packages" ]; then
            echo "No packages are ready for COPR; mirror retry will run on the next schedule."
            exit 0
          fi
          if [ -z "$COPR_WEBHOOK_BASE" ]; then
            echo "::error::COPR_WEBHOOK_BASE secret is not configured; specs were pushed but no COPR build was triggered."
            exit 1
          fi
          base="${COPR_WEBHOOK_BASE%/}"
          for pkg in $packages; do
            echo "Triggering COPR rebuild for $pkg ..."
            curl --retry 3 --retry-all-errors --retry-delay 5 -fsS -X POST "$base/$pkg/"
          done

      - name: Retry failed payload builds (COPR infra flakes)
        if: success()
        env:
          COPR_WEBHOOK_BASE: ${{ secrets.COPR_WEBHOOK_BASE }}
          MIRROR_MISSING: ${{ steps.mirror.outputs.mirror_missing }}
        run: |
          set -euo pipefail
          # Do not re-trigger builds that are already queued/running. Only
          # retry terminal failures (or a package with no build yet).
          for pkg in linuxqq netease-cloud-music; do
            case " $MIRROR_MISSING " in
              *" $pkg "*) echo "$pkg: waiting for its mirror asset"; continue ;;
            esac
            state=$(curl -fsS \
              "https://copr.fedorainfracloud.org/api_3/build/list?ownername=qvoidz&projectname=rpm-packages&packagename=$pkg&limit=1" \
              | jq -r '.items[0].state // "missing"')
            case "$state" in
              succeeded|pending|running|starting|skipped)
                echo "$pkg: latest build state is $state; no retry needed"
                ;;
              failed|canceled|cancelled|missing)
                if [ -z "$COPR_WEBHOOK_BASE" ]; then
                  echo "::error::$pkg latest build is '$state' but COPR_WEBHOOK_BASE is not configured"
                  exit 1
                fi
                echo "$pkg: latest build state is $state; re-triggering"
                base="${COPR_WEBHOOK_BASE%/}"
                curl --retry 3 --retry-all-errors --retry-delay 5 -fsS -X POST "$base/$pkg/"
                ;;
              *)
                echo "::error::Unknown COPR build state for $pkg: $state"
                exit 1
                ;;
            esac
          done
