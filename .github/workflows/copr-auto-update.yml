name: Update packages on COPR

on:
  workflow_dispatch:
  schedule:
    - cron: "23 21 * * *" # 21:23 UTC = 05:23 Beijing time, after the Pages repo sync

permissions:
  contents: write

concurrency:
  group: copr-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3-rpm

      - name: Detect upstream updates and bump specs
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-updates.py

      - name: Commit and push bumped specs
        if: steps.bump.outputs.changed != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update specs: ${{ steps.bump.outputs.changed }}"
          git push

      - name: Trigger COPR builds
        if: steps.bump.outputs.changed != ''
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
        run: |
          if [ -z "$COPR_LOGIN" ] || [ -z "$COPR_TOKEN" ]; then
            echo "::warning::COPR_LOGIN / COPR_TOKEN secrets are not configured; spec bumps were pushed but no COPR build was triggered."
            exit 0
          fi
          python3 -m pip install --quiet --user --break-system-packages copr
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p ~/.config
          {
            echo "[copr-cli]"
            echo "copr_url = https://copr.fedorainfracloud.org"
            echo "login = $COPR_LOGIN"
            echo "token = $COPR_TOKEN"
            echo "username = ${COPR_USERNAME:-qvoidz}"
          } > ~/.config/copr
          chmod 600 ~/.config/copr
          for pkg in ${{ steps.bump.outputs.changed }}; do
            copr-cli buildscm --nowait \
              --clone-url "https://github.com/${{ github.repository }}" \
              --spec "$pkg/$pkg.spec" \
              "${COPR_USERNAME:-qvoidz}/rpm-packages"
          done
