name: Mirror upstream payloads

# Fetches payloads that Tencent/NetEase gate behind real-time URL signing
# or Referer checks and publishes them as GitHub Release assets, so COPR
# can fetch them as plain Source0 URLs. COPR's binary build chroots are
# fully offline (probed: even mirrors.fedoraproject.org is unreachable);
# only the SRPM stage has network access, and it can only do bare GETs.
#
# Runs BEFORE the daily copr-auto-update workflow (21:10 vs 21:23 UTC) so
# a fresh upstream release is mirrored before the spec bump triggers a
# COPR build. Push triggers cover manual maintenance; runs are idempotent
# (an existing release asset short-circuits the job).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mirror.yml"
      - "linuxqq/**"
      - "netease-cloud-music/**"
  schedule:
    - cron: "10 21 * * *" # 21:10 UTC, 13 min before copr-auto-update

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  linuxqq:
    name: Mirror QQ Linux RPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the latest upstream RPM from Tencent's config
        id: resolve
        run: |
          curl -fsSL 'https://cdn-go.cn/qq-web/im.qq.com_new/latest/rainbow/pcConfig.json' \
            | python3 -c "
          import json, re, sys
          urls = re.findall(r'https://qqdl\.gtimg\.cn/[^\"\\\\]+\.rpm',
                            json.dumps(json.load(sys.stdin)))
          matches = [u for u in dict.fromkeys(urls)
                     if re.search(r'QQ_[\d.]+_\d+_x86_64_\d+\.rpm$', u)]
          assert len(matches) == 1, f'unexpected config contents: {matches}'
          m = re.search(r'QQ_([\d.]+)_\d+_x86_64', matches[0])
          print('bare=' + matches[0])
          print('version=' + m.group(1))
          print('asset=' + matches[0].rsplit('/', 1)[1])
          " | tee /tmp/resolve.env
          grep -E '^(bare|version|asset)=' /tmp/resolve.env >> "$GITHUB_OUTPUT"

      - name: Skip if already mirrored
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: linuxqq-${{ steps.resolve.outputs.version }}
          ASSET: ${{ steps.resolve.outputs.asset }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' \
              2>/dev/null | grep -Fxq "$ASSET"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$ASSET is already on release $TAG"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign and download
        if: steps.skip.outputs.already != 'true'
        env:
          BARE: ${{ steps.resolve.outputs.bare }}
          WANT: linuxqq-${{ steps.resolve.outputs.version }}
        run: |
          signed=$(curl -fsSL --retry 5 --retry-delay 3 \
            -H 'Content-Type: application/json' \
            -H 'x-oidb: {"uint32_command":"0x9b8e","uint32_service_type":1}' \
            -H 'Origin: https://im.qq.com' \
            -H 'Referer: https://im.qq.com' \
            -d "{\"url\":\"$BARE\"}" \
            'https://im.qq.com/http2rpc/gotrpc/noauth/trpc.qqntv2.urlsign.UrlSign/GetSign')
          dl=$(printf '%s' "$signed" | python3 -c "
          import json, sys
          def find(d):
              if isinstance(d, dict):
                  for k, v in d.items():
                      if k == 'url' and isinstance(v, str) and 'qqdl.gtimg.cn' in v:
                          return v
                      r = find(v)
                      if r:
                          return r
              return None
          url = find(json.load(sys.stdin))
          assert url, 'no signed url in response'
          print(url)
          ")
          curl -fsSL --retry 5 --retry-delay 3 -o payload.rpm "$dl"
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm >/dev/null
          info=$(rpm -qp --qf '%{NAME}-%{VERSION}' payload.rpm)
          echo "payload RPM: $info ($(stat -c%s payload.rpm) bytes)"
          [ "$info" = "$WANT" ]

      - name: Publish release asset
        if: steps.skip.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: linuxqq-${{ steps.resolve.outputs.version }}
          ASSET: ${{ steps.resolve.outputs.asset }}
        run: |
          cp payload.rpm "$ASSET"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Upstream QQ Linux RPM, mirrored via Tencent's signing API for COPR builds." \
            || true
          gh release upload "$TAG" "$ASSET" --clobber
          echo "Published $ASSET on release $TAG"

  netease-cloud-music:
    name: Probe NetEase CDN from a datacenter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe download with Referer
        id: probe
        run: |
          url=$(sed -n 's/^%global netease_deb_url //p' \
            netease-cloud-music/netease-cloud-music.spec)
          version=$(sed -n 's/^Version: *//p' \
            netease-cloud-music/netease-cloud-music.spec | head -1)
          asset=$(basename "$url")
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -fsSL --retry 3 \
              -e 'https://music.163.com/download' \
              -A 'Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0' \
              -o "$asset" "$url"; then
            size=$(stat -c%s "$asset")
            echo "downloaded $asset: $size bytes"
            [ "$size" -gt 50000000 ]
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NetEase CDN blocks datacenter IPs even with Referer; netease-cloud-music stays an install-time shell package."
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release asset
        if: steps.probe.outputs.reachable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: netease-cloud-music-${{ steps.probe.outputs.version }}
          ASSET: ${{ steps.probe.outputs.asset }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Upstream NetEase Cloud Music .deb, mirrored for COPR builds." \
            || true
          gh release upload "$TAG" "$ASSET" --clobber
          echo "Published $ASSET on release $TAG"
